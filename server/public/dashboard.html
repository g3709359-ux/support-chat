<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Binance Support Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0d0e12; color:#eee; }
  #app { display:flex; height:100vh; }
  #conv-list { width:260px; background:#15161c; border-right:1px solid #222; overflow-y:auto; }
  .conv-item { padding:12px 14px; cursor:pointer; border-bottom:1px solid #1e1f26; }
  .conv-item:hover, .conv-item.active { background:#1e2028; }
  .conv-item .name { font-weight:600; font-size:14px; }
  .conv-item .preview { font-size:12px; color:#999; margin-top:2px; }
  #chat { flex:1; display:flex; flex-direction:column; }
  #chat-header { padding:14px; background:#15161c; font-weight:600; border-bottom:1px solid #222; }
  #chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:60%; font-size:14px; }
  .msg.visitor { align-self:flex-start; background:#2a2c36; }
  .msg.agent { align-self:flex-end; background:#f5b400; color:#111; }
  .msg.file-msg { padding:6px; }
  .msg img.msg-img { max-width:100%; border-radius:8px; display:block; cursor:pointer; }
  .msg a.file-link { display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit; padding:2px 4px; }
  #chat-input { display:flex; gap:8px; padding:12px; border-top:1px solid #222; }
  #chat-input input[type="text"] { flex:1; padding:10px; border-radius:8px; border:none; background:#22242c; color:#fff; }
  #chat-input button { padding:10px 18px; border-radius:8px; border:none; background:#f5b400; cursor:pointer; font-weight:600; }
  #attach-btn { padding:10px 14px; border-radius:8px; border:1px solid #2a2c36; background:#22242c; cursor:pointer; color:#f5b400; font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <div id="conv-list"></div>
  <div id="chat">
    <div id="chat-header">Select a conversation</div>
    <div id="chat-messages"></div>
    <div id="chat-input">
      <input id="reply-file-input" type="file" accept="image/*,.pdf,.doc,.docx,.txt" style="display:none;" />
      <button id="attach-btn" title="Attach file">📎</button>
      <input id="reply-input" type="text" placeholder="Type a reply..." />
      <button id="reply-send">Send</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io({ query: { role: 'agent' } });

  const conversations = {};
  let activeId = null;
  const MAX_FILE_SIZE = 5 * 1024 * 1024;

  const listEl = document.getElementById('conv-list');
  const headerEl = document.getElementById('chat-header');
  const messagesEl = document.getElementById('chat-messages');
  const inputEl = document.getElementById('reply-input');
  const sendBtn = document.getElementById('reply-send');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('reply-file-input');

  function renderList() {
    listEl.innerHTML = '';
    Object.values(conversations).forEach(conv => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (conv.visitorId === activeId ? ' active' : '');
      const last = conv.messages[conv.messages.length - 1];
      const preview = last ? (last.file ? '📎 ' + last.file.name : last.text) : 'No messages yet';
      div.innerHTML = `<div class="name">Visitor</div>
        <div class="preview">${preview}</div>`;
      div.onclick = () => { activeId = conv.visitorId; renderList(); renderChat(); };
      listEl.appendChild(div);
    });
  }

  function renderMsg(m) {
    const row = document.createElement('div');
    row.className = 'msg ' + m.from + (m.file ? ' file-msg' : '');

    if (m.file) {
      if (m.file.type && m.file.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = m.file.dataUrl;
        img.className = 'msg-img';
        img.onclick = () => window.open(m.file.dataUrl, '_blank');
        row.appendChild(img);
      } else {
        const link = document.createElement('a');
        link.href = m.file.dataUrl;
        link.download = m.file.name;
        link.className = 'file-link';
        link.innerHTML = `📄 <span>${m.file.name}</span>`;
        row.appendChild(link);
      }
      if (m.text) {
        const caption = document.createElement('div');
        caption.textContent = m.text;
        caption.style.marginTop = '6px';
        row.appendChild(caption);
      }
    } else {
      row.textContent = m.text;
    }
    return row;
  }

  function renderChat() {
    const conv = conversations[activeId];
    headerEl.textContent = 'Visitor';
    messagesEl.innerHTML = '';
    if (!conv) return;
    conv.messages.forEach(m => messagesEl.appendChild(renderMsg(m)));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  socket.on('conversation_list', (list) => {
    Object.assign(conversations, list);
    renderList();
  });

  socket.on('new_conversation', (conv) => {
    conversations[conv.visitorId] = conv;
    renderList();
  });

  socket.on('conversation_updated', ({ visitorId, msg }) => {
    if (!conversations[visitorId]) conversations[visitorId] = { visitorId, messages: [] };
    conversations[visitorId].messages.push(msg);
    renderList();
    if (visitorId === activeId) renderChat();
  });

  function sendReply() {
    const text = inputEl.value.trim();
    if (!text || !activeId) return;
    socket.emit('agent_message', { visitorId: activeId, text });
    inputEl.value = '';
  }

  sendBtn.onclick = sendReply;
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendReply(); });

  attachBtn.onclick = () => {
    if (!activeId) { alert('Select a conversation first.'); return; }
    fileInput.click();
  };

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file || !activeId) return;

    if (file.size > MAX_FILE_SIZE) {
      alert('File is too large. Max size is 5MB.');
      fileInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      socket.emit('agent_message', {
        visitorId: activeId,
        text: '',
        file: { name: file.name, type: file.type, dataUrl: reader.result }
      });
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });
</script>
</body>
</html>
